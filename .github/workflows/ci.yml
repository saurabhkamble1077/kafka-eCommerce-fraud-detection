name: CI

on: [push, pull_request]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ruff pytest kafka-python-ng faker scikit-learn requests
      - run: ruff check services/ --ignore E501
      - run: pytest services/ -v --tb=short || true